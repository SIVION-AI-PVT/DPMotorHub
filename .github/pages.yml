# Pages CMS Configuration File for DP MotorHub
# Documentation: https://pagescms.org/docs

media:
  input: public/assets
  output: /assets

content:
  - name: products
    label: M Performance Parts Catalog
    type: collection
    path: src/data/products
    format: json
    fields:
      - name: id
        label: SKU / Part ID
        type: string
        required: true
      - name: name
        label: Product Name
        type: string
        required: true
      - name: price
        label: Price (LKR)
        type: number
        required: true
      - name: category
        label: Category
        type: select
        options:
          - label: Exterior & Carbon Aero
            value: exterior
          - label: Interior & Cockpit
            value: interior
          - label: Engine & Performance
            value: engine
          - label: Wheels & Fitment
            value: wheels
          - label: Brakes & Suspension
            value: brakes-suspension
      - name: image
        label: Product Image Path / Upload
        type: image
      - name: isMPerformance
        label: Genuine M Performance Badge
        type: boolean
      - name: oem
        label: OEM Part Number
        type: string
      - name: material
        label: Construction Material
        type: string
      - name: stock
        label: Stock Status
        type: string
      - name: rating
        label: Customer Rating
        type: number
      - name: reviewsCount
        label: Total Reviews Count
        type: number

  - name: settings
    label: Global Site Settings & Contact Info
    type: file
    file: src/data/settings.json
    fields:
      - name: siteName
        label: Brand Name
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: announcementText
        label: Top Announcement Bar Title
        type: string
      - name: announcementSubtext
        label: Top Announcement Bar Subtitle
        type: string
      - name: contactPhone
        label: Contact Support Phone
        type: string
      - name: contactEmail
        label: Support Email Address
        type: string
      - name: location
        label: Store Location
        type: string
      - name: businessHours
        label: Opening Hours
        type: string
