# Pages CMS Configuration
# Documentation: https://pagescms.org/docs

media:
  input: public/assets
  output: /assets

content:
  - name: products
    label: M Performance Parts Catalog
    type: collection
    path: src/data/products
    format: json
    filename: "{fields.id}.json"
    view:
      primary: name
      fields: [id, name, price, category, stock]
    fields:
      - name: id
        label: SKU / Part ID
        type: string
        required: true
      - name: name
        label: Product Name
        type: string
        required: true
      - name: price
        label: Price (LKR)
        type: number
        required: true
      - name: category
        label: Category
        type: select
        options:
          - label: Exterior & Carbon Aero
            value: exterior
          - label: Interior & Cockpit
            value: interior
          - label: Engine & Performance
            value: engine
          - label: Wheels & Fitment
            value: wheels
          - label: Brakes & Suspension
            value: brakes-suspension
      - name: models
        label: Compatible BMW Chassis Codes
        type: list
        field:
          type: string
      - name: image
        label: Product Image Path
        type: image
      - name: isMPerformance
        label: Genuine M Performance Badge
        type: boolean
        default: true
      - name: oem
        label: OEM Part Number
        type: string
      - name: material
        label: Construction Material
        type: string
      - name: stock
        label: Stock Status
        type: select
        options:
          - label: In Stock
            value: In Stock
          - label: Low Stock (2 Left)
            value: Low Stock (2 Left)
          - label: Pre-Order (7-10 Days)
            value: Pre-Order (7-10 Days)
          - label: Out of Stock
            value: Out of Stock
      - name: rating
        label: Customer Rating (1.0 - 5.0)
        type: number
        default: 5.0
      - name: reviewsCount
        label: Total Reviews Count
        type: number
        default: 12
      - name: description
        label: Full Technical Description
        type: rich-text

  - name: settings
    label: Global Site Settings & Verified Contact Info
    type: file
    path: src/data/settings.json
    fields:
      - name: siteName
        label: Brand Name
        type: string
        default: MOTORHUB
      - name: tagline
        label: Tagline
        type: string
        default: Genuine BMW M Performance Parts
      - name: announcementText
        label: Top Announcement Bar Title
        type: string
        default: 100% Genuine BMW M Performance Hardware
      - name: announcementSubtext
        label: Top Announcement Bar Subtitle
        type: string
        default: Fast Worldwide Delivery | VIN Fitment Verification Guaranteed
      - name: contactPhone
        label: Contact Phone / WhatsApp
        type: string
        default: "+94 77 123 4567"
      - name: contactEmail
        label: Official Sole Email Address
        type: string
        default: "hello@dpmotorhub.com"
      - name: location
        label: Official Showroom Location Address
        type: string
        default: "325/1/A/3, Ihala Biyanwila, Kadawatha"
      - name: businessHours
        label: Business Opening Hours
        type: string
        default: "Mon - Fri: 9:00 AM - 6:00 PM | Sat: 10:00 AM - 4:00 PM"
